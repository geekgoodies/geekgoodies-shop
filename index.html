<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GeekGoodies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1F2C44; --orange:#E18A2C; --price:#B5600E; --green:#0F7B4F; --green-bg:#E8F6EE;
          --line:#EDEFF3; --ink:#1F2C44; --muted:#5E6B80; --red:#B42318; --red-bg:#FDECEA; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink);
         font-family:Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding:18px 16px; border-bottom:1px solid var(--line); }
  .mark { font-weight:800; font-size:22px; letter-spacing:-0.02em; color:var(--navy); }
  main { max-width:560px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:26px; line-height:1.2; margin:0 0 8px; letter-spacing:-0.01em; }
  p { color:var(--muted); line-height:1.55; margin:0 0 20px; font-weight:500; }
  .check { margin-top:36px; padding-top:20px; border-top:1px solid var(--line); }
  .check h2 { font-size:15px; margin:0 0 4px; }
  .check p { font-size:14px; margin-bottom:14px; }
  button, .btn { display:block; width:100%; min-height:48px; border:0; border-radius:10px; font:inherit;
         font-weight:700; font-size:16px; cursor:pointer; text-align:center; text-decoration:none; line-height:48px; }
  .run { background:var(--green); color:#fff; }
  .run:disabled { opacity:.6; cursor:wait; }
  .wa { background:var(--green-bg); color:var(--green); margin-top:10px; }
  button:focus-visible, .btn:focus-visible { outline:3px solid var(--orange); outline-offset:2px; }
  ol { list-style:none; padding:0; margin:16px 0 0; }
  li { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  li .s { width:22px; flex:none; font-weight:800; }
  li .t { flex:1; }
  li small { display:block; color:var(--muted); margin-top:2px; word-break:break-word; }
  .ok .s { color:var(--green); } .bad .s { color:var(--red); }
  .verdict { margin-top:16px; padding:14px; border-radius:10px; font-weight:800; font-size:18px; display:none; }
  .verdict.pass { display:block; background:var(--green-bg); color:var(--green); }
  .verdict.fail { display:block; background:var(--red-bg); color:var(--red); }
  .meta { font-size:12px; color:var(--muted); margin-top:10px; word-break:break-word; }
</style>
</head>
<body>
<header><span class="mark">GeekGoodies</span></header>
<main>
  <h1>Our clearance list is being set up</h1>
  <p>Gift and décor stock from Nashik at wholesale prices. The full list opens here soon.</p>

  <section class="check" aria-labelledby="chk">
    <h2 id="chk">Connection check</h2>
    <p>For the shop team: tap once on each phone and browser being tested.</p>
    <button class="run" id="run">Run check</button>
    <ol id="steps"></ol>
    <div class="verdict" id="verdict" role="status"></div>
    <a class="btn wa" id="wa" href="#">Open WhatsApp (don't send)</a>
    <div class="meta" id="meta"></div>
  </section>
</main>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbxR8AuxpKtwFU_bJXM82Ap86DMsUZlgHDbKXJY_lQXLJzxdZjhZM7TDV_sG4UMdHBB0/exec';
  var WA = '919226525940';
  var PUBLIC = ['no','name','section','price','gst','stock_shown','photos','desc','asin','amazon_price','amazon_date'];
  var ua = navigator.userAgent;
  var client = (/WhatsApp/i.test(ua) ? 'WhatsApp in-app' : /; wv\)/.test(ua) ? 'Android in-app (WebView)' :
               /FBAN|FBAV|Instagram/i.test(ua) ? 'FB/Insta in-app' : /CriOS|Chrome/i.test(ua) ? 'Chrome' :
               /Safari/i.test(ua) ? 'Safari' : 'Other') + ' · ' +
               (/Android/i.test(ua) ? 'Android' : /iPhone|iPad/i.test(ua) ? 'iOS' : /Windows/i.test(ua) ? 'Windows' : /Mac/i.test(ua) ? 'Mac' : 'other OS');
  var $ = function (id) { return document.getElementById(id); };
  $('meta').textContent = 'Browser seen as: ' + client;
  $('wa').href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent('GeekGoodies link check - please ignore');

  function newId() {
    var d = new Date(Date.now() + 5.5 * 3600 * 1000);   // IST date
    var p = function (n) { return String(n).padStart(2, '0'); };
    var abc = '0123456789ABCDEFGHJKMNPQRSTVWXYZ', s = '';
    var r = new Uint8Array(4); crypto.getRandomValues(r);
    for (var i = 0; i < 4; i++) s += abc[r[i] % 32];
    return 'GG-' + String(d.getUTCFullYear()).slice(2) + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + '-' + s;
  }
  function step(text) {
    var li = document.createElement('li');
    li.innerHTML = '<span class="s">…</span><span class="t"></span>';
    li.querySelector('.t').textContent = text;
    $('steps').appendChild(li);
    return function (ok, note) {
      li.className = ok ? 'ok' : 'bad';
      li.querySelector('.s').textContent = ok ? '✓' : '✗';
      if (note) { var sm = document.createElement('small'); sm.textContent = note; li.querySelector('.t').appendChild(sm); }
      return ok;
    };
  }
  function timed(promise, ms) {
    return Promise.race([promise, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timed out after ' + ms / 1000 + ' s')); }, ms); })]);
  }
  function getJSON(q) {
    return timed(fetch(EXEC + '?' + q, { cache: 'no-store', credentials: 'omit' }).then(function (r) { return r.json(); }), 20000);
  }
  function postJSON(body) {
    return timed(fetch(EXEC, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body) }).then(function (r) { return r.json(); }), 20000);
  }

  $('run').addEventListener('click', async function () {
    var btn = this; btn.disabled = true; btn.textContent = 'Checking…';
    $('steps').innerHTML = ''; $('verdict').className = 'verdict'; $('verdict').textContent = '';
    var c = encodeURIComponent(client), all = true, t;
    var id = newId();

    var s1 = step('1. Read the product list');
    try {
      t = Date.now(); var g = await getJSON('test=1&cl=' + c);
      var extra = [];
      (g.products || []).forEach(function (p) { Object.keys(p).forEach(function (k) { if (PUBLIC.indexOf(k) < 0) extra.push(k); }); });
      all = s1(g.ok && g.count >= 1 && extra.length === 0,
        g.count + ' item(s), ' + Object.keys(g.config || {}).length + ' settings, ' + (Date.now() - t) + ' ms' +
        (extra.length ? ' · NON-PUBLIC FIELD: ' + extra.join(',') : '')) && all;
    } catch (e) { all = s1(false, String(e.message || e)) && all; }

    var order = { id: id, test: true, name: 'Gate test', area: 'Test', note: '', client: client, items: [{ no: 999, qty: 2 }] };
    var s2 = step('2. Send a test order ' + id), readable = true;
    try {
      t = Date.now(); var a = await postJSON(order);
      all = s2(a.ok === true && a.duplicate === false && a.total === 298, 'saved · total Rs ' + a.total + ' · ' + (Date.now() - t) + ' ms') && all;
    } catch (e) {
      readable = false;
      try { await fetch(EXEC, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(order) }); } catch (e2) {}
      all = s2(false, 'reply not readable (' + (e.message || e) + ') · sent again without reply, see step 4') && all;
    }

    var s3 = step('3. Send the same order again (must be ignored)');
    try {
      var b = await postJSON(order);
      all = s3(b.ok === true && b.duplicate === true, b.duplicate ? 'ignored as repeat' : 'NOT flagged as repeat') && all;
    } catch (e) { all = s3(false, String(e.message || e)) && all; }

    var s4 = step('4. Confirm the order is in the sheet');
    try {
      var k = await getJSON('check=' + id + '&cl=' + c);
      all = s4(k.found === true, k.found ? 'found' : 'not found') && all;
    } catch (e) { all = s4(false, String(e.message || e)) && all; }

    var v = $('verdict');
    v.className = 'verdict ' + (all ? 'pass' : 'fail');
    v.textContent = all ? 'All 4 checks passed' : (readable ? 'Check failed - send a screenshot' : 'Replies blocked in this browser - send a screenshot');
    btn.disabled = false; btn.textContent = 'Run check again';
  });
})();
</script>
</body>
</html>
